name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 45
    # ubuntu-latest zeigt seit Oktober 2026 auf 26.04. Playwright 1.51 kann dort
    # keine Browser installieren ("Playwright does not support chromium on
    # ubuntu26.04-x64"). Deshalb fest auf 24.04 (von 1.51 unterstuetzt).
    runs-on: ubuntu-24.04
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      REDIS_URL: ${{ secrets.REDIS_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Version kommt aus packageManager in package.json - ein zusaetzliches
          # `version:` wuerde hier als "Multiple versions of pnpm specified" brechen.
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Der Browser-Download bleibt auf GitHub-Runnern sporadisch haengen
      # (belegt: 29 min bei ~50 % von cdn.playwright.dev, danach Job-Timeout).
      # Er laeuft deshalb mit hartem Kommando-Timeout und ist nicht fatal:
      # der Test-Schritt ruft aktuell `pnpm test` (vitest) und braucht Chromium
      # nicht. Ein Step-Timeout waere hier falsch - der macht den Job trotz
      # continue-on-error rot.
      - name: Install Playwright Browsers (optional)
        continue-on-error: true
        env:
          PLAYWRIGHT_DOWNLOAD_HOST: https://playwright.azureedge.net
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: |
          timeout --signal=KILL 300 pnpm exec playwright install --with-deps chromium \
            || echo "::warning::Chromium-Installation abgebrochen (CDN/Netz) - Unit-Tests laufen ohne Browser"

      - name: Run tests
        run: pnpm test

      - uses: actions/upload-artifact@v7
        if: always() && !cancelled()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

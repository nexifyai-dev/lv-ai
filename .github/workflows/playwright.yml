name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 45
    # ubuntu-latest zeigt seit Oktober 2026 auf 26.04. Playwright 1.51 kann dort
    # keine Browser installieren ("Playwright does not support chromium on
    # ubuntu26.04-x64"). Deshalb fest auf 24.04 (von 1.51 unterstuetzt).
    runs-on: ubuntu-24.04
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      REDIS_URL: ${{ secrets.REDIS_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        env:
          # GitHub-Runner stehen bei Azure: der Default-CDN (cdn.playwright.dev)
          # bleibt dort sporadisch bei ~50 % stehen und laeuft in den Job-Timeout.
          PLAYWRIGHT_DOWNLOAD_HOST: https://playwright.azureedge.net
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: |
          for i in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium; then exit 0; fi
            echo "::warning::Chromium-Download Versuch $i fehlgeschlagen, neuer Versuch in 15s"
            sleep 15
          done
          echo "::error::Chromium konnte nach 3 Versuchen nicht installiert werden"
          exit 1

      - name: Run Playwright tests
        run: pnpm test

      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
